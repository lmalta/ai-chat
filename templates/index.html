<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mon IA locale</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <div class="app-layout">


        <!-- =========================
             SIDEBAR
             ========================= -->

        <aside class="conversation-sidebar">


            <h1>🤖 Mon IA locale</h1>


            <button
                id="newConversationButton"
                class="new-conversation-button"
            >
                + Nouvelle conversation
            </button>


            <h2>Historique</h2>


            <div id="conversationList"></div>


        </aside>



        <!-- =========================
             ZONE PRINCIPALE
             ========================= -->

        <main class="main-content">


            <div class="controls">


                <label for="model">

                    <strong>Modèle :</strong>

                </label>


                <select id="model">

                    {% for model in models %}

                    <option
                        value="{{ model }}"
                        {% if model == default_model %}
                        selected
                        {% endif %}
                    >

                        {{ model }}

                    </option>

                    {% endfor %}

                </select>


                <label class="stats-checkbox">

                    <input
                        type="checkbox"
                        id="showStats"
                        checked
                    >

                    Afficher les statistiques

                </label>


            </div>



            <!-- =========================
                 CHAT
                 ========================= -->

            <div class="chat-area">

                <div id="chat"></div>

            </div>



            <!-- =========================
                 SAISIE
                 ========================= -->

            <div class="input-area">


                <!-- =========================
                     UPLOAD DOCUMENT
                     ========================= -->

                <div class="document-upload">


                    <input
                        type="file"
                        id="documentInput"
                        accept=".pdf,.xlsx"
                        hidden
                    >


                    <button
                        type="button"
                        id="documentButton"
                        class="secondary"
                    >
                        📎 Ajouter un document
                    </button>


                    <span
                        id="documentStatus"
                        class="document-status"
                    ></span>


                </div>


                <textarea
                    id="prompt"
                    placeholder="Écris ton message..."
                ></textarea>


                <div class="buttons">


                    <button id="sendButton">
                        Envoyer
                    </button>


                    <button
                        id="stopButton"
                        class="secondary"
                        disabled
                    >
                        ⏹ Stop
                    </button>


                    <button
                        id="clearButton"
                        class="secondary"
                    >
                        Nouvelle conversation
                    </button>


                </div>


            </div>


        </main>


    </div>



    <!-- =========================
         Fenêtre statistiques
         ========================= -->

    <div
        id="statsModal"
        class="modal hidden"
    >


        <div class="modal-content">


            <button
                id="closeStats"
                class="close"
            >

                ×

            </button>


            <h2>📊 Statistiques</h2>


            <div id="statsContent"></div>


        </div>


    </div>


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css"
    >


    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>


    <script
        src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"
    ></script>


    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>


</body>

</html>
